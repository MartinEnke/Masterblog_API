services:
  - type: web
    name: the-quiet-almanac
    env: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: python -m backend.backend_app
    envVars:
      - key: SECRET_KEY
        value: your-secret-key
      - key: SMTP_SERVER
        value: smtp.yourhost.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: your@email.com
      - key: SMTP_PASSWORD
        value: your-password
      - key: EMAIL_FROM
        value: no-reply@quietalmanac.com
      - key: ENV
        value: production
      - key: OPENAI_API_KEY
        value: your-openai-key
      - key: HUME_KEY
        value: your-hume-key
