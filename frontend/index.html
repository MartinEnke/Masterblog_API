<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Quiet Almanac</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/styles.css" />

  <style>
    body { font-family: 'Poppins', sans-serif; }
    .hidden { display: none; }
    .ai-badge {
      font-style: italic;
      font-size: 0.8rem;
      background-color: #e0e0e0;
      padding: 2px 6px;
      border-radius: 4px;
      color: #444;
    }
  </style>

  <!-- Google Translate -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,de,fr,es',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
    function loadGoogleTranslate() {
      document.getElementById("google_translate_element").classList.remove("hidden");
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4">

<!-- Header -->
<!-- Banner as refresh (reloads full page) -->
<header class="flex justify-center mb-6 cursor-pointer" onclick="location.reload()">
  <img src="/static/images/almanac.png"
       alt="Notes on the Miraculous Ordinary"
       class="w-full max-w-5xl rounded-lg shadow-lg"
  />
</header>
<!-- Language Translators Section -->
<div class="flex flex-row flex-wrap items-center justify-center gap-8 mb-6 text-center">

  <!-- OpenAI Translator -->
  <div class="flex flex-col items-center">
    <h3 class="font-bold text-gray-700 mb-2">OpenAI Translator</h3>
    <select id="lang-select" onchange="setLanguage(this.value)"
      class="text-sm border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
  </div>

  <!-- Translator Label
  <div class="text-gray-500 font-semibold mt-4 md:mt-10">Translator</div> -->

  <!-- Google Widget Translator
  <div class="flex flex-col items-center">
    <h3 class="font-bold text-gray-700 mb-2">Google Widget</h3>
    <button onclick="loadGoogleTranslate()"
      class="text-sm border border-gray-300 rounded-md px-3 py-2 bg-white text-gray-700 hover:bg-gray-100 focus:ring-2 focus:ring-blue-500">
      Choose
    </button>
    <div id="google_translate_element" class="mt-2 hidden"></div>
  </div> -->

</div>

<!-- Main Container -->
<main class="bg-white max-w-5xl mx-auto p-6 rounded-lg shadow-md">

  <!-- Top Navigation -->
  <section class="bg-white shadow-sm rounded-lg p-4 mb-6">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
  <!-- Left: Signup + Auth -->
  <div class="flex items-center gap-4 justify-start order-1 md:order-1 w-full md:w-auto">
    <button
      onclick="openSignupModal()"
      class="text-base text-blue-700 hover:text-blue-900 bg-transparent hover:bg-transparent focus:outline-none transition-colors"
      data-i18n="signup">Signup</button>

    <button id="auth-button"
      onclick="handleAuthClick()"
      class="text-base text-blue-700 hover:text-blue-900 bg-transparent hover:bg-transparent focus:outline-none transition-colors"
      data-i18n="login">Login</button>

    <div id="user-info" class="text-green-800 font-semibold text-base"></div>
  </div>

  <!-- Right: Load & Add buttons -->
  <div class="flex items-center gap-3 justify-end order-2 md:order-2 w-full md:w-auto">
    <!-- Hidden API base URL input -->
    <input
      id="api-base-url"
      type="text"
      placeholder="https://your-host:port/api/v2"
      value=""
      class="hidden w-[300px] h-9 px-3 py-1.5 text-sm border border-gray-300 rounded-md shadow-sm"
    />

    <!-- Uncomment if needed
    <button id="load-posts-btn"
      onclick="loadPosts()"
      class="text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-md transition">
      Load Posts
    </button> -->

    <button
      onclick="openAddModal()"
      data-i18n="addPost"
      class="text-base font-medium text-green-700 hover:text-green-900 px-4 py-2 rounded-md bg-transparent hover:bg-transparent focus:outline-none transition-colors"
    >
      Add Post
    </button>
  </div>
</div>
<div id="email-section" class="hidden mt-4 p-2 border rounded">
  <label for="email-input" class="text-sm">📧 Your email for notifications:</label>
  <input type="email" id="email-input" class="border px-2 py-1 rounded text-sm" placeholder="you@example.com" />
  <button id="save-email-btn" class="ml-2 bg-purple-600 text-white text-sm px-3 py-1 rounded">Save</button>
  <span id="email-msg" class="text-xs text-green-600 ml-2"></span>
</div>

  </section>

  <!-- Filters & Search -->
  <section class="bg-white shadow-sm rounded-lg p-4 mb-6">
    <div class="flex flex-col gap-4">
      <!-- Dropdowns -->
      <div class="flex flex-col md:flex-row md:items-center md:gap-4">
        <select id="filter-category" data-i18n-option onchange="loadPosts()" class="w-full md:w-[180px] text-sm px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
          <option value="">All Categories</option>
        </select>

        <div class="flex flex-col sm:flex-row gap-4 flex-1 mt-4 md:mt-0">
          <select id="sort-field" data-i18n-option onchange="loadPosts()" class="flex-1 text-sm px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
            <option value="">noSorting</option>
            <option value="date" data-i18n-option="sortDate">Date</option>
            <option value="author" data-i18n-option="sortAuthor">Author</option>
            <option value="title" data-i18n-option="sortTitle">Title</option>
            <option value="likes" data-i18n-option="sortLikes">Likes</option>
            <option value="updated" data-i18n-option="sortUpdated">Last Updated</option>
          </select>

          <select id="sort-direction" data-i18n-option onchange="loadPosts()" class="flex-1 text-sm px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
            <option value="desc" data-i18n-option="descending">Descending</option>
            <option value="asc" data-i18n-option="ascending">Ascending</option>

          </select>

          <button
  onclick="loadPosts()"
  data-i18n="applyFilters"
  class="hidden text-sm text-blue-600 hover:text-blue-800 px-4 py-2 rounded-md transition border border-blue-200"
>
  Apply Filters
</button>
        </div>
      </div>

      <div class="relative">
        <input
          type="text"
          id="search-input"
          oninput="loadPosts()"
          data-i18n-placeholder="searchPlaceholder"
          placeholder="Search author, title or content..."
          class="w-full text-sm pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
        />
        <div class="absolute inset-y-0 left-3 flex items-center text-gray-400 pointer-events-none"></div>
      </div>
    </div>
  </section>

  <!-- Posts Container -->
  <section id="post-container"></section>
</main>

<!-- Modals -->
<div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-lg w-full max-w-md shadow-lg">
    <h2 data-i18n="login" class="text-xl font-bold mb-4">🔐 Login</h2>
    <input type="text" id="login-username" data-i18n-placeholder="usernamePlaceholder" placeholder="Username" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md">
    <input type="password" id="login-password" data-i18n-placeholder="passwordPlaceholder" placeholder="Password" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md">
    <div class="flex justify-end gap-3">
      <span class="text-white bg-blue-600 px-4 py-2 rounded-md cursor-pointer" data-i18n="login" onclick="submitLogin()">Login</span>
      <span class="text-gray-600 bg-gray-200 px-4 py-2 rounded-md cursor-pointer" data-i18n="cancel" onclick="closeLoginModal()">Cancel</span>
    </div>
  </div>
</div>

<div id="signup-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-lg w-full max-w-md shadow-lg">
    <h2 data-i18n="signup" class="text-xl font-bold mb-4">📝 Signup</h2>
    <input type="text" id="signup-username" data-i18n-placeholder="usernamePlaceholder" placeholder="Username" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md">
    <input type="password" id="signup-password" data-i18n-placeholder="passwordPlaceholder" placeholder="Password" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md">
    <div class="flex justify-end gap-3">
      <button data-i18n="register" onclick="submitSignup()" class="text-white bg-blue-600 px-4 py-2 rounded-md">Register</button>
      <button data-i18n="cancel" onclick="closeSignupModal()" class="text-gray-600 bg-gray-200 px-4 py-2 rounded-md">Cancel</button>
    </div>
  </div>
</div>

<div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-lg w-full max-w-md sm:max-w-lg md:max-w-xl lg:max-w-2xl max-h-screen overflow-y-auto shadow-lg">
    <h2 data-i18n="addPost" class="text-xl font-bold mb-4">📝 Add Post</h2>
    <input type="text" id="add-title" data-i18n-placeholder="titlePlaceholder" placeholder="Title" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md">
    <textarea id="add-content" data-i18n-placeholder="contentPlaceholder" placeholder="Content" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md min-h-[200px]"></textarea>
    <select id="add-category" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md"></select>
    <div id="custom-category-wrapper-add" class="hidden mb-4">
      <input type="text" id="custom-category-input-add" placeholder="Enter custom category" class="w-full px-3 py-2 border border-gray-300 rounded-md">
    </div>
    <div class="flex justify-end gap-3">
      <span class="text-white bg-blue-600 px-4 py-2 rounded-md cursor-pointer" data-i18n="save" onclick="submitAdd()">Save</span>
      <span class="text-gray-600 bg-gray-200 px-4 py-2 rounded-md cursor-pointer" data-i18n="cancel" id="cancel-add-btn">Cancel</span>
    </div>
  </div>
</div>

<div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-lg w-full max-w-md sm:max-w-lg md:max-w-xl lg:max-w-2xl max-h-screen overflow-y-auto shadow-lg">
    <h2 data-i18n="editPost" class="text-xl font-bold mb-4">✏️ Edit Post</h2>
    <input type="text" id="edit-title" data-i18n-placeholder="titlePlaceholder" placeholder="Title" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md">
    <textarea id="edit-content" data-i18n-placeholder="contentPlaceholder" placeholder="Content" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md min-h-[200px]"></textarea>
    <select id="edit-category" class="w-full mb-4 px-3 py-2 border border-gray-300 rounded-md"></select>
    <div id="custom-category-wrapper-edit" class="hidden mb-4">
      <input type="text" id="custom-category-input-edit" placeholder="Enter custom category" class="w-full px-3 py-2 border border-gray-300 rounded-md">
    </div>
    <div class="flex justify-end gap-3">
      <span class="text-white bg-blue-600 px-4 py-2 rounded-md cursor-pointer" data-i18n="save" onclick="submitUpdate()">Save</span>
      <span class="text-gray-600 bg-gray-200 px-4 py-2 rounded-md cursor-pointer" data-i18n="cancel" onclick="closeModal()">Cancel</span>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="text-center text-gray-400 text-sm mt-10">&copy; The Quiet Almanac 2025</footer>

<!-- Scripts -->
<script src="/static/i18n.js"></script>
<script src="/static/main.js" defer></script>
</body>
</html>
