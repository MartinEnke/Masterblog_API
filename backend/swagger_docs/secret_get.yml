tags:
  - Auth
summary: Test token authentication
description: Returns a welcome message if the token is valid. Requires authentication.
parameters:
  - name: Authorization
    in: header
    required: true
    schema:
      type: string
    description: Bearer token (e.g., Bearer YOUR_TOKEN_HERE)
responses:
  '200':
    description: Token is valid
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Welcome, authenticated user!
  '401':
    description: Invalid or missing token
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              example: Token is missing or invalid
  '429':
    description: Rate limit exceeded
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              example: Too many requests, try again later.